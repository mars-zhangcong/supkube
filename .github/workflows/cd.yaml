name: CD

# 发布管道 (v0.9.1.14 ADR-042 修订):
#   - push to main           → 自动推 aks-jumborca-dev (Mars 笔记本 → 云上 dev 闭环)
#   - tag v*-test / v*-rc.*  → 推 aks-jumborca-test
#   - tag v* (正式版)        → 推 aks-jumborca-test → manual gate → aks-jumborca-prod
#   - workflow_dispatch      → 手动选 environment (dev/test/prod 任一)
#
# 与 ENGINEERING.md §4 发布流程 + ADR-042 一致 (架构设计.md §9)。
# ADR-042 收口了 docker-desktop 退役 + CI 接管所有部署 + dev-deploy.sh 退役。
on:
  push:
    branches: ["main"]            # ⬅ ADR-042 新增: main 提交即自动推 aks-dev
    tags: ["v*"]                  # 仅 v* tag (e.g. v0.9.1.10-alpha) 才推 test/prod
  workflow_dispatch:
    inputs:
      environment:
        description: 部署目标环境
        type: choice
        options: [dev, test, prod]
        default: dev

permissions:
  id-token: write                # OIDC 换 Azure token 必需（无密码）
  contents: read

env:
  ACR_LOGIN_SERVER: supkube.azurecr.io
  ACR_NAME: supkube
  CHART_DIR: supkube-helm/supkube
  AKS_RG: Research_and_Development   # 已按 az aks list 实测填入 (同 RG 内 dev/test/prod)
  AKS_NAME_DEV: aks-jumborca-dev
  AKS_NAME_TEST: aks-jumborca-test
  AKS_NAME_PROD: aks-jumborca-prod   # ⚠ 该集群尚未创建 (ADR-042 §5)，deploy-prod 启动前需先 az aks create

jobs:
  # ─────────────── 1) 构建多架构镜像并推 ACR ───────────────
  build-push:
    name: Build & Push (multi-arch → ACR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号（tag → 产品版本）
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"          # v0.9.1.10-alpha → 0.9.1.10-alpha
          else
            V="0.0.0-dev-${GITHUB_SHA::8}"    # 手动 dispatch 用 sha 派生
          fi
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "▶ VERSION=$V"

      - uses: azure/login@v2                  # OIDC，无密码
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 登录（token 现取，规避 1h TTL 过期）
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-qemu-action@v3     # arm64 跨架构构建需要 QEMU
      - uses: docker/setup-buildx-action@v3

      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./supkube-backend
          file: ./docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64  # 一个 manifest list 双架构
          push: true
          build-args: |
            SUPKUBE_VERSION=${{ steps.ver.outputs.version }}
            CACHEBUST=${{ github.run_id }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/backend:${{ steps.ver.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false                   # ACR 对 provenance 附件兼容性差，关掉避免 push 400

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./supkube-frontend
          file: ./docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ steps.ver.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 推送后即时校验（推成功≠能拉；确认双架构 manifest list）
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 1) Tag 存在: show-tags 走 repository 维度
          az acr repository show-tags -n "$ACR_NAME" --repository backend  -o tsv | grep -qx "$V" || { echo "::error::backend:$V 未出现在 ACR"; exit 1; }
          az acr repository show-tags -n "$ACR_NAME" --repository frontend -o tsv | grep -qx "$V" || { echo "::error::frontend:$V 未出现在 ACR"; exit 1; }
          # 2) 是 manifest list (双架构) — buildx 推 multi-arch 产 manifest list,
          #    list 本身 platform-agnostic, sub-manifest 才带 architecture。
          #    我们查 mediaType 包含 "manifest.list" 即可证明是多架构。
          #    NOTE: `az acr manifest list-metadata --name "<repo>:<tag>"` 是错的语法
          #    (--name 只接 repo, 不接 :tag); 用 -r/-n + query tags 才对。
          backend_media=$(az acr manifest list-metadata -r "$ACR_NAME" -n backend  --query "[?tags[?@=='$V']].mediaType | [0]" -o tsv)
          frontend_media=$(az acr manifest list-metadata -r "$ACR_NAME" -n frontend --query "[?tags[?@=='$V']].mediaType | [0]" -o tsv)
          echo "backend  mediaType: $backend_media"
          echo "frontend mediaType: $frontend_media"
          echo "$backend_media"  | grep -q "manifest.list" || { echo "::error::backend:$V 不是 manifest list (single-arch 推上去会 ImagePullBackOff / exec format error 在 wrong-arch 节点)"; exit 1; }
          echo "$frontend_media" | grep -q "manifest.list" || { echo "::error::frontend:$V 不是 manifest list"; exit 1; }
          echo "✅ backend + frontend 双架构 manifest list verified"

  # ─────────────── 2a) 部署 dev 集群（ADR-042：main 提交即推） ───────────────
  deploy-dev:
    name: Deploy → aks-jumborca-dev (auto, on main push)
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev                          # 无审批，自动 (push to main 或 manual=dev)
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 取 aks-jumborca-dev 凭据
        run: az aks get-credentials -n "$AKS_NAME_DEV" -g "$AKS_RG" --overwrite-existing
      - uses: azure/setup-helm@v4
        with: { version: v3.14.0 }
      - name: helm upgrade → supkube ns（aks-dev = Mars 日常验证）
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm dependency build "$CHART_DIR"
          # 2026-06-02 fix: --timeout 5m → 15m + --burst-limit 300
          # Fresh-install on a busy cluster (Kasten K10 + KubeVirt 共存) hits
          # client-go default QPS=5/Burst=10, large 1st-install CRD+RBAC+Deploy
          # 调用排队等不到 5m timeout → "client rate limiter Wait ... context
          # deadline exceeded". 实测见 CD #6 deploy-test. 修法: 给 helm 大 burst
          # (3.13+ supports --burst-limit) + 长 timeout. Upgrade 后 CD 再跑同
          # cluster 是真 upgrade 不再大量 install, 但保留宽 timeout 防 chart
          # 加新 CRD 时再撞.
          helm upgrade --install supkube "$CHART_DIR" \
            -n supkube --create-namespace \
            --set eula.accept=true \
            --set backend.image.repository=$ACR_LOGIN_SERVER/backend \
            --set backend.image.tag=${{ needs.build-push.outputs.version }} \
            --set frontend.image.repository=$ACR_LOGIN_SERVER/frontend \
            --set frontend.image.tag=${{ needs.build-push.outputs.version }} \
            --set service.frontend.type=LoadBalancer \
            --wait --timeout 15m \
            --burst-limit 300
      - name: Verify-before-ship（Rule D · aks-dev）
        run: |
          chmod +x hack/ci-verify.sh
          ./hack/ci-verify.sh supkube ${{ needs.build-push.outputs.version }}

  # ─────────────── 2b) 部署 test 集群（tag 触发自动） ───────────────
  deploy-test:
    name: Deploy → aks-jumborca-test (auto, on v* tag)
    needs: build-push
    runs-on: ubuntu-latest
    environment: test                         # 无审批，自动
    if: github.ref_type == 'tag' || github.event.inputs.environment == 'test'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: 取 aks-jumborca-test 凭据
        run: az aks get-credentials -n "$AKS_NAME_TEST" -g "$AKS_RG" --overwrite-existing
      - uses: azure/setup-helm@v4
        with: { version: v3.14.0 }
      - name: helm upgrade → supkube ns（aks-test = QA 集群, 含 Kasten K10 + KubeVirt 共存）
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm dependency build "$CHART_DIR"
          # 2026-06-02 fix: --timeout 5m → 15m + --burst-limit 300
          # CD #6 实测撞 "client rate limiter Wait ... context deadline exceeded"
          # 根因: test cluster 跟 Kasten K10 + KubeVirt + CDI + demo-vm* 共存,
          # API server 负载高; fresh install (release "supkube" does not exist)
          # 大量 CRD+RBAC+Deploy 一次性 create, 默认 client-go QPS=5/Burst=10
          # 排队等不到 5m timeout. 修法: helm 3.13+ 支持 --burst-limit 调大,
          # timeout 也给 15m fresh-install. Upgrade 走时 install→upgrade 资源
          # 已 ready, 不会再大量 install API 调用, 但保留宽配置防 chart 加新 CRD.
          helm upgrade --install supkube "$CHART_DIR" \
            -n supkube --create-namespace \
            --set eula.accept=true \
            --set backend.image.repository=$ACR_LOGIN_SERVER/backend \
            --set backend.image.tag=${{ needs.build-push.outputs.version }} \
            --set frontend.image.repository=$ACR_LOGIN_SERVER/frontend \
            --set frontend.image.tag=${{ needs.build-push.outputs.version }} \
            --wait --timeout 15m \
            --burst-limit 300
      - name: Verify-before-ship（Rule D · aks-test）
        run: |
          chmod +x hack/ci-verify.sh
          ./hack/ci-verify.sh supkube ${{ needs.build-push.outputs.version }}

  # ─────────────── 2c) 持续冒烟测试（test 部署后自动）→ 结果发布到 test-results 分支 ───────────────
  # 一旦新版本 CD 到 aks-jumborca-test，立即对实时集群跑 测试用例.md §1 P0 冒烟可自动化子集，
  # 产出结构化结果并发布到 test-results 分支（Dashboard 从该分支拉取渲染）。
  smoke-test:
    name: Smoke Test → publish to Dashboard
    needs: [build-push, deploy-test]
    runs-on: ubuntu-latest
    environment: test                         # 同 deploy-test：OIDC subject=environment:test
    if: github.ref_type == 'tag' || github.event.inputs.environment == 'test'
    permissions:
      id-token: write                         # OIDC 登录 Azure
      contents: write                         # 推 test-results 分支（非受保护分支）
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/setup-kubectl@v4
      - name: 取 aks-jumborca-test 凭据
        run: az aks get-credentials -n "$AKS_NAME_TEST" -g "$AKS_RG" --overwrite-existing

      - name: 跑 P0 冒烟套件（产出 smoke-results/）
        id: smoke
        continue-on-error: true               # 测试失败不立即中断 → 先把结果发布上去，再让 job 反映红
        env:
          CLUSTER: aks-jumborca-test
          # 若 test 集群开了认证（AUTH_ENABLED=true），在此注入 token：
          # SUPKUBE_TOKEN: ${{ secrets.SUPKUBE_TEST_TOKEN }}
        run: |
          chmod +x hack/smoke-test.sh hack/ci-verify.sh
          ./hack/smoke-test.sh "${{ needs.build-push.outputs.version }}"

      - name: 发布结果到 test-results 分支（Dashboard 数据源）
        if: always()
        run: |
          set -e
          git config --global user.name  "supkube-ci[bot]"
          git config --global user.email "ci@supkube.local"
          PUB=$(mktemp -d); cd "$PUB"
          git init -q
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin test-results 2>/dev/null; then
            git checkout -q -b test-results origin/test-results
          else
            git checkout -q --orphan test-results
            git rm -rq . 2>/dev/null || true     # 孤儿分支起步，清空索引
          fi
          cp "$GITHUB_WORKSPACE"/smoke-results/test-results.json ./test-results.json
          cp "$GITHUB_WORKSPACE"/smoke-results/test-results.md   ./test-results.md
          # 维护近 50 次 run 的趋势索引，供 Dashboard 画 sparkline
          [ -f history.json ] || echo '[]' > history.json
          NEW=$(jq -c '{runId,timestamp,version,cluster,summary}' ./test-results.json)
          jq --argjson n "$NEW" '. + [$n] | .[-50:]' history.json > history.json.tmp && mv history.json.tmp history.json
          git add -A
          git commit -q -m "test-results: ${{ needs.build-push.outputs.version }} @ $(date -u +%FT%TZ)" || { echo "无变化，跳过推送"; exit 0; }
          git push -q origin test-results

      - name: 让 job 反映测试结果（有 failed 用例则 job 红）
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" != "success" ]; then
            echo "::error::冒烟测试存在失败用例，详见上方日志与 test-results 分支报告"
            exit 1
          fi
          echo "✅ 冒烟测试全绿"

  # ─────────────── 3) 部署 prod 集群（人工卡点 · ADR-042 §5 集群待创建） ───────────────
  deploy-prod:
    name: Deploy → aks-jumborca-prod (manual approval, cluster guard)
    needs: [build-push, deploy-test]
    runs-on: ubuntu-latest
    environment: prod                         # GH Environment 的 Required reviewers = 人工卡点
    if: github.ref_type == 'tag' || github.event.inputs.environment == 'prod'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Guard — 确认 prod 集群已创建（ADR-042 §5）
        run: |
          if ! az aks show -n "$AKS_NAME_PROD" -g "$AKS_RG" >/dev/null 2>&1; then
            echo "::error::aks-jumborca-prod 尚未创建（ADR-042 §5 未启动）。先 az aks create 再 retry。"
            echo "::notice::命令参考: az aks create -g $AKS_RG -n $AKS_NAME_PROD --node-count 3 ..."
            exit 1
          fi
      - name: 取 aks-jumborca-prod 凭据
        run: az aks get-credentials -n "$AKS_NAME_PROD" -g "$AKS_RG" --overwrite-existing
      - uses: azure/setup-helm@v4
        with: { version: v3.14.0 }
      - name: helm upgrade → supkube ns（aks-prod = 生产, --atomic 失败自动回滚）
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm dependency build "$CHART_DIR"
          # 2026-06-02 fix: --timeout 5m → 15m + --burst-limit 300
          # 跟 dev/test 同源根因: fresh install 大量 CRD+RBAC+Deploy 容易撞
          # client-go rate limiter timeout. prod 走 --atomic 自动回滚,
          # 短 timeout 误判失败 → 触发不必要的 rollback. 给充足时间.
          helm upgrade --install supkube "$CHART_DIR" \
            -n supkube --create-namespace \
            --set eula.accept=true \
            --set backend.image.repository=$ACR_LOGIN_SERVER/backend \
            --set backend.image.tag=${{ needs.build-push.outputs.version }} \
            --set frontend.image.repository=$ACR_LOGIN_SERVER/frontend \
            --set frontend.image.tag=${{ needs.build-push.outputs.version }} \
            --wait --timeout 15m \
            --burst-limit 300 \
            --atomic                          # 升级失败自动回滚到上一个 release
      - name: Verify-before-ship（生产）
        run: |
          chmod +x hack/ci-verify.sh
          ./hack/ci-verify.sh supkube ${{ needs.build-push.outputs.version }}
