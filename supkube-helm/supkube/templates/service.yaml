apiVersion: v1
kind: Service
metadata:
  name: {{ include "supkube.fullname" . }}-backend
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.backendPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supkube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supkube.fullname" . }}-frontend
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.frontendPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supkube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
