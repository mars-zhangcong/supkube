{{- if .Values.kbAddon.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supkube.fullname" . }}-kbui-frontend
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: kbui-frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "supkube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kbui-frontend
  template:
    metadata:
      labels:
        {{- include "supkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kbui-frontend
      annotations:
        # Roll the pod when the nginx config changes — otherwise nginx
        # would keep serving the old config until next manual restart.
        checksum/nginx: {{ include (print $.Template.BasePath "/kbui-frontend-nginx-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: kbui-frontend
          image: {{ include "supkube.image" (dict "root" $ "repository" .Values.kbAddon.frontend.image.repository "tag" .Values.kbAddon.frontend.image.tag) | quote }}
          imagePullPolicy: {{ .Values.kbAddon.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.kbAddon.frontend.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /plugins/kubeblocks-ui/
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /plugins/kubeblocks-ui/
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.kbAddon.frontend.resources | nindent 12 }}
          # nginx config from ConfigMap — serves SPA at /plugins/kubeblocks-ui/
          # and proxies /api/plugins/kubeblocks-ui/ to the kbui-backend Service.
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "supkube.fullname" . }}-kbui-frontend-nginx
            items:
              - key: default.conf
                path: default.conf
{{- end }}
