name: CD

# 发布管道 (2026-06-09 Mars 修订)：
#   build-push → 构建多架构镜像推 ACR（所有触发）。
#   deploy-dev → **仅 dev** 自动滚动更新 aks-jumborca-dev（push main 时）。
#     - push to main      → 构建 0.0.0-dev-<sha> 镜像推 ACR + 自动部署 aks-dev
#     - tag v*            → 构建 <version> 镜像推 ACR（test/prod 不在此自动部署）
#     - workflow_dispatch → 只构建
#
# 为什么 dev 部署加回 CI（2026-06-09，修订 2026-06-04 ADR-042 的「部署全退役」）：
#   当初退役是因为**环境参数不固定**（kubeconfig/publicURL 无安全默认，硬塞 CI 每次 push 都红）。
#   现在 **aks-dev 环境已固定**（LB IP=4.144.200.141 稳定、publicURL 固定），dev 的部署参数
#   不再是变量，可安全内联。dev kubeconfig 走 GH secret（KUBECONFIG_AKS_DEV），runner 读不到本地 CD/。
#   **客户/现场环境仍是 on-site 安装，不走此 job**——各自 kubeconfig + publicURL，由现场 operator
#   跑 CD/deploy-commands.md。test/prod 同样仍走 operator（环境参数各异，未固定）。
#
# 关联：ADR-042（架构设计.md §9，本次修订「dev 部署加回 CI」）· CD/README.md · CD/deploy-commands.md。
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  id-token: write                # OIDC 换 Azure token 必需（无密码）
  contents: read

env:
  ACR_LOGIN_SERVER: supkube.azurecr.io
  ACR_NAME: supkube

jobs:
  # ─────────────── 构建多架构镜像并推 ACR ───────────────
  build-push:
    name: Build & Push (multi-arch → ACR)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本号（tag → 产品版本）
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"          # v0.9.1.10-alpha → 0.9.1.10-alpha
          else
            V="0.0.0-dev-${GITHUB_SHA::8}"    # 手动 dispatch 用 sha 派生
          fi
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "▶ VERSION=$V"

      - uses: azure/login@v2                  # OIDC，无密码
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR 登录（token 现取，规避 1h TTL 过期）
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-qemu-action@v3     # arm64 跨架构构建需要 QEMU
      - uses: docker/setup-buildx-action@v3

      - name: Build & Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./supkube-backend
          file: ./docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64  # 一个 manifest list 双架构
          push: true
          build-args: |
            SUPKUBE_VERSION=${{ steps.ver.outputs.version }}
            CACHEBUST=${{ github.run_id }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/backend:${{ steps.ver.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false                   # ACR 对 provenance 附件兼容性差，关掉避免 push 400

      - name: Build & Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./supkube-frontend
          file: ./docker/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ steps.ver.outputs.version }}
            ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 推送后即时校验（推成功≠能拉；确认双架构 manifest list）
        run: |
          V="${{ steps.ver.outputs.version }}"
          # 1) Tag 存在: show-tags 走 repository 维度
          az acr repository show-tags -n "$ACR_NAME" --repository backend  -o tsv | grep -qx "$V" || { echo "::error::backend:$V 未出现在 ACR"; exit 1; }
          az acr repository show-tags -n "$ACR_NAME" --repository frontend -o tsv | grep -qx "$V" || { echo "::error::frontend:$V 未出现在 ACR"; exit 1; }
          # 2) 是 manifest list (双架构) — buildx 推 multi-arch 产 manifest list,
          #    list 本身 platform-agnostic, sub-manifest 才带 architecture。
          #    我们查 mediaType 包含 "manifest.list" 即可证明是多架构。
          #    NOTE: `az acr manifest list-metadata --name "<repo>:<tag>"` 是错的语法
          #    (--name 只接 repo, 不接 :tag); 用 -r/-n + query tags 才对。
          backend_media=$(az acr manifest list-metadata -r "$ACR_NAME" -n backend  --query "[?tags[?@=='$V']].mediaType | [0]" -o tsv)
          frontend_media=$(az acr manifest list-metadata -r "$ACR_NAME" -n frontend --query "[?tags[?@=='$V']].mediaType | [0]" -o tsv)
          echo "backend  mediaType: $backend_media"
          echo "frontend mediaType: $frontend_media"
          echo "$backend_media"  | grep -q "manifest.list" || { echo "::error::backend:$V 不是 manifest list (single-arch 推上去会 ImagePullBackOff / exec format error 在 wrong-arch 节点)"; exit 1; }
          echo "$frontend_media" | grep -q "manifest.list" || { echo "::error::frontend:$V 不是 manifest list"; exit 1; }
          echo "✅ backend + frontend 双架构 manifest list verified"

  # ─────────────── 部署到 aks-dev（2026-06-09 修订：dev 环境参数已固定，部署加回 CI）───────────────
  # 仅 dev：push main 自动滚动更新 aks-jumborca-dev。dev 的环境参数现已固定（LB IP/publicURL 稳定），
  # 不再是 ADR-042 当初退役的“不固定环境参数”。**客户/现场环境是 on-site 安装，不走此 job**
  # （各自的 kubeconfig + publicURL，由现场 operator 跑 CD/deploy-commands.md）。
  # 前置（一次性，Mars 配）：GitHub Actions secret KUBECONFIG_AKS_DEV = base64(CD/kubeconfigs/aks-dev.yaml)。
  #   生成: base64 -i CD/kubeconfigs/aks-dev.yaml | pbcopy  → 贴进 repo Settings▸Secrets▸Actions。
  deploy-dev:
    name: Deploy → aks-jumborca-dev (dev only)
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # 仅 push main，tag/dispatch 不部署
    steps:
      - uses: actions/checkout@v4

      - name: 写入 dev kubeconfig（来自 secret，runner 读不到本地 CD/）
        run: |
          if [ -z "${{ secrets.KUBECONFIG_AKS_DEV }}" ]; then
            echo "::error::缺 secret KUBECONFIG_AKS_DEV——先配: base64 -i CD/kubeconfigs/aks-dev.yaml 贴进 repo Secrets"; exit 1
          fi
          echo "${{ secrets.KUBECONFIG_AKS_DEV }}" | base64 -d > /tmp/kubeconfig-dev.yaml
          chmod 600 /tmp/kubeconfig-dev.yaml

      - uses: azure/setup-helm@v4

      - name: helm upgrade → aks-dev（dev 固定参数）
        env:
          KUBECONFIG: /tmp/kubeconfig-dev.yaml
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm dependency build supkube-helm/supkube
          helm upgrade --install supkube supkube-helm/supkube \
            -n supkube --create-namespace \
            --set eula.accept=true \
            --set backend.image.repository=${{ env.ACR_LOGIN_SERVER }}/backend  --set backend.image.tag="$VERSION" \
            --set frontend.image.repository=${{ env.ACR_LOGIN_SERVER }}/frontend --set frontend.image.tag="$VERSION" \
            --set service.frontend.type=LoadBalancer \
            --set auth.dex.publicURL=http://4.144.200.141 \
            --wait --timeout 15m --burst-limit 300

      - name: 验证（Rule D：version/buildStamp 应变新）
        run: |
          export KUBECONFIG=/tmp/kubeconfig-dev.yaml
          kubectl -n supkube rollout status deploy/supkube-frontend --timeout=120s
          curl -sf http://4.144.200.141/api/v1/status
