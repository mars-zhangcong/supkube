replicaCount: 1

backend:
  image:
    repository: supkube/backend
    tag: "0.7.5-alpha"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: supkube/frontend
    tag: "0.7.5-alpha"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  backend:
    type: ClusterIP
    port: 8080
  frontend:
    type: NodePort
    port: 80
    nodePort: 30888

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: supkube.local
      paths:
        - path: /
          pathType: Prefix

config:
  veleroNamespace: velero
  logLevel: info
