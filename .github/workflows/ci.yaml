name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Build + Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supkube-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must match the `go` directive in supkube-backend/go.mod (the
          # authoritative source). A lower version here makes GOTOOLCHAIN=auto
          # silently re-download the real toolchain mid-run — slow and fragile.
          go-version: "1.25.0"
          cache-dependency-path: supkube-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o supkube-backend .

  frontend:
    name: Frontend (Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supkube-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: supkube-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  dashboard-drift:
    name: Dashboard Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # gen-data.mjs re-derives dashboard PRDS/ADRS from the authoritative
      # sources (PRD.md index + 架构设计.md ADR-LEDGER) and exits 1 on drift.
      # Pure node stdlib — no npm install needed. This turns the "docs lie
      # because dashboard data drifted" failure mode into a red build.
      - name: Check dashboard data drift
        run: node dashboard/gen-data.mjs

  # 旧的 ghcr `docker` push job 已移除：真实发布仓库是 ACR（supkube.azurecr.io），
  # 镜像构建+推送由 .github/workflows/cd.yaml 在打 tag 时接管；PR 阶段的镜像
  # 构建冒烟 + 安全扫描由下面的 image-scan job 覆盖。

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"           # 与 go.mod / backend job 一致
          cache-dependency-path: supkube-backend/go.sum

      - name: gofmt 校验（未格式化即失败）
        working-directory: supkube-backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未 gofmt，请本地跑 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: supkube-backend
          args: --timeout=5m

      # 前端 lint 暂未启用：supkube-frontend/package.json 目前只有 build/dev/preview，
      # 无 lint/test 脚本。要启用见 CICD.md §2.1（需先加 eslint/prettier/vue-tsc）。

  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本地构建（不推送）后用 Trivy 扫描，PR 阶段就拦住高危 CVE，
      # 同时充当 Dockerfile 构建冒烟测试（取代旧 ghcr docker job 的构建验证）。
      - name: Build backend image (local, no push)
        run: docker build -f docker/Dockerfile.backend -t supkube/backend:scan ./supkube-backend

      - name: Build frontend image (local, no push)
        run: docker build -f docker/Dockerfile.frontend -t supkube/frontend:scan ./supkube-frontend

      - name: Trivy scan backend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: supkube/backend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true             # 上游未修复的不卡板，避免噪声卡死发布
          exit-code: "1"

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: supkube/frontend:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      # The velero subchart (charts/velero-*.tgz) is gitignored, so a fresh
      # checkout has an empty charts/ dir. Without this, `helm lint` only
      # WARNs about the missing dependency and still exits 0 — it lints a
      # chart with the dependency stubbed out. Pull it (pinned by Chart.lock)
      # so lint validates the real, fully-resolved chart.
      - name: Build chart dependencies
        run: |
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm dependency build ./supkube-helm/supkube

      - name: Lint chart
        run: helm lint ./supkube-helm/supkube --set eula.accept=true
