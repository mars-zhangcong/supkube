apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supkube.fullname" . }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "supkube.fullname" . }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups", "restores", "schedules", "backupstoragelocations", "volumesnapshotlocations"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  # Read-only access to CSI snapshot resources so SupKube can:
  #   - list VolumeSnapshotClass options when user picks Volume Backup Mode
  #   - surface VolumeSnapshot/VolumeSnapshotContent progress in BackupDetail
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  # Read access to StorageClasses + CSIDrivers so Policy capability detection
  # can determine which namespaces have PVCs on CSI-snapshot-capable SCs.
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services", "persistentvolumeclaims", "configmaps", "nodes"]
    verbs: ["get", "list"]
  # Secrets: write access needed because creating a BackupStorageLocation also
  # provisions a credentials Secret in the velero namespace. Cluster-wide for
  # simplicity in v0.5.x; v0.8 RBAC overhaul will restrict this to a
  # velero-namespace-scoped Role.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "supkube.fullname" . }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "supkube.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "supkube.fullname" . }}
    namespace: {{ .Release.Namespace }}
