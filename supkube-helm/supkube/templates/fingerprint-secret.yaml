{{- /*
v0.9.1.13 — Fingerprint Secret (HMAC shared secret).

Holds the 32-byte shared secret used to sign+verify Velero Backup CRs as
they cross cluster boundaries via ImportPolicy (CRD: importpolicies.supkube.io).

Resolution order (most-specific wins):
  1. user-supplied   .Values.fingerprint.sharedSecret  (already base64)
  2. previously-installed Secret on this cluster — looked up and re-emitted
     so `helm upgrade` does NOT rotate the secret (rotation would break
     every existing cross-cluster trust relationship).
  3. fresh random 32-byte secret via `randAlphaNum 32 | b64enc`. Single
     cluster only; for cross-cluster you MUST install option 1 on every
     participating cluster.

Cross-cluster install pattern (DO THIS for multi-cluster DR):
    SUPKUBE_FP_SECRET=$(openssl rand -base64 32)
    helm install supkube ... --set fingerprint.sharedSecret="$SUPKUBE_FP_SECRET"  # cluster A
    helm install supkube ... --set fingerprint.sharedSecret="$SUPKUBE_FP_SECRET"  # cluster B

resource-policy=keep so `helm uninstall` does NOT delete the secret —
deletion would break the trust chain even if the customer just wants to
reinstall the chart.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: supkube-fingerprint-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
{{- if .Values.fingerprint.sharedSecret }}
  sharedSecret: {{ .Values.fingerprint.sharedSecret | quote }}
{{- else }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "supkube-fingerprint-secret" }}
  {{- if and $existing $existing.data }}
  sharedSecret: {{ index $existing.data "sharedSecret" | quote }}
  {{- else }}
  sharedSecret: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
