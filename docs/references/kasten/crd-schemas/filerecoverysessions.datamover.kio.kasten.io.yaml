    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FileRecoverySession is a custom resource used to request access to the
          filesystem content of one or more previously saved volumes snapshots through
          some transport protocol, without the need to restore the entire snapshot.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FileRecoverySessionSpec specifies volume backups whose contents are to be made
              accessible through one or more transport protocols.

              There are 2 types of transport protocols, Filesystem based or Block based.

              Filesystem based transport protocols can be used to access volume snapshot
              content containing filesytems, regardless of the original VolumeMode used to
              mount the volume, or the data format used to export the volume.
              These transports expose the content of all the requested
              volume snapshots in a single tree whose root contains sub-directories
              named for each unique restore point, and each restore point directory contains
              sub-directories named for the specified PVCs. The PVC directories each contain the
              filesystem content of the snapshot of that PVC in that restore point.

              Block based transport protocols can be used to access the content
              of volumes that were mounted with a VolumeMode value of Block.
              They provide block level access to individual snapshots.
            properties:
              transports:
                description: |-
                  Transports specifies the transport protocols to be used.
                  At least one transport protocol must be specified.
                properties:
                  sftp:
                    description: SFTP contains configuration information for Secure
                      FTP.
                    properties:
                      userPublicKey:
                        description: UserPublicKey is the public SSH key of a user
                          authorized to use the service.
                        minLength: 1
                        type: string
                    required:
                    - userPublicKey
                    type: object
                type: object
              volumes:
                description: |-
                  Volumes is a list of volume backups, each identified by the name of the volume PVC
                  and a RestorePoint that captured the content of that volume at some point in time.

                  It is possible to repeat the PVC and RestorePoint names across list entries, but the
                  combination of any specific PVC and RestorePoint name must be distinct in the list.
                  Specifying multiple RestorePoints for a single PVC enables the detection
                  of changes between the snapshots. Specifying just a single RestorePoint is useful
                  when the RestorePoint containing the data to be recovered is known.

                  External policy may limit the number of volume requests that can be specified.
                  Runtime availability of resources may limit the ability to fulfil the request.
                items:
                  description: |-
                    VolumeRestorePoint specifies the PVC whose snapshot data is to
                    be recovered, and the RestorePoint that captured this snapshot.
                  properties:
                    pvcName:
                      description: PVCName is the name of a PersistentVolumeClaim
                        object in the Namespace.
                      minLength: 1
                      type: string
                    restorePointName:
                      description: |-
                        RestorePointName is the name of an apps.kio.kasten.io/v1alpha1 RestorePoint
                        object in the Namespace.

                        Currently only exported RestorePoint objects can be specified.
                      minLength: 1
                      type: string
                  required:
                  - pvcName
                  - restorePointName
                  type: object
                minItems: 1
                type: array
            required:
            - transports
            - volumes
            type: object
