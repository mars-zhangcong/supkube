apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supkube.fullname" . }}-config
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
data:
  # Resolve the Velero namespace the backend talks to. The bundled Velero
  # subchart (chart 12.0.1) deploys into .Release.Namespace — it does NOT
  # honor namespaceOverride — so when velero.enabled, SupKube and Velero share
  # the release namespace and the backend must follow it. An explicit
  # config.veleroNamespace always wins (use it for an external Velero install).
  veleroNamespace: {{ include "supkube.veleroNamespace" . | quote }}
  logLevel: {{ .Values.config.logLevel | quote }}
