apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "supkube.fullname" . }}-backend
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "supkube.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "supkube.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "supkube.fullname" . }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          env:
            - name: VELERO_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "supkube.fullname" . }}-config
                  key: veleroNamespace
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "supkube.fullname" . }}-config
                  key: logLevel
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
