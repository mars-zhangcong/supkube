<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" width="220" height="230">
  <title>SupKube Logo</title>
  <desc>Shield containing Kubernetes helm wheel with K monogram</desc>

  <!-- Shield -->
  <path d="M 110 10 L 210 40 L 210 120 C 210 170 170 205 110 220 C 50 205 10 170 10 120 L 10 40 Z" fill="#10B981"/>
  <path d="M 110 18 L 202 46 L 202 120 C 202 166 166 198 110 212 C 54 198 18 166 18 120 L 18 46 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Kubernetes helm wheel -->
  <g transform="translate(110, 115)">
    <circle r="62" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.55"/>
    <g stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.55" stroke-linecap="round">
      <line x1="0" y1="-62" x2="0" y2="-46"/>
      <line x1="43.8" y1="-43.8" x2="32.5" y2="-32.5"/>
      <line x1="62" y1="0" x2="46" y2="0"/>
      <line x1="43.8" y1="43.8" x2="32.5" y2="32.5"/>
      <line x1="0" y1="62" x2="0" y2="46"/>
      <line x1="-43.8" y1="43.8" x2="-32.5" y2="32.5"/>
      <line x1="-62" y1="0" x2="-46" y2="0"/>
      <line x1="-43.8" y1="-43.8" x2="-32.5" y2="-32.5"/>
    </g>

    <!-- K monogram -->
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-20" y1="-38" x2="-20" y2="38"/>
      <line x1="-20" y1="2" x2="22" y2="-38"/>
      <line x1="-20" y1="2" x2="22" y2="38"/>
    </g>
  </g>
</svg>
