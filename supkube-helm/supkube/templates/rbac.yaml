apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "supkube.fullname" . }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "supkube.fullname" . }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups", "restores", "schedules", "backupstoragelocations"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "supkube.fullname" . }}
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "supkube.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "supkube.fullname" . }}
    namespace: {{ .Release.Namespace }}
