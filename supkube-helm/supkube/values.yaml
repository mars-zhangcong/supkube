replicaCount: 1

backend:
  image:
    repository: supkube/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  image:
    repository: supkube/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  type: ClusterIP
  backendPort: 8080
  frontendPort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: supkube.local
      paths:
        - path: /
          pathType: Prefix

config:
  veleroNamespace: velero
  logLevel: info
