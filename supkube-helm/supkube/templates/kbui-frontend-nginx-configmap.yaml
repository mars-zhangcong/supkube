{{- if .Values.kbAddon.enabled }}
# nginx config for the KBUI frontend SPA. Serves the plugin at
# /plugins/kubeblocks-ui/ and proxies /api/plugins/kubeblocks-ui/ to the
# kbui-backend Service. Mounted over the image's default nginx conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supkube.fullname" . }}-kbui-frontend-nginx
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: kbui-frontend
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Long-cache hashed assets (Vite produces content-hashed filenames).
        location ~* ^/plugins/kubeblocks-ui/assets/.*\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # KBUI backend API proxy under the plugin sub-path.
        location /api/plugins/kubeblocks-ui/ {
            proxy_pass http://{{ include "supkube.fullname" . }}-kbui-backend:{{ .Values.kbAddon.backend.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        # SPA shell — never cached.
        location = /plugins/kubeblocks-ui/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        # SPA fallback for the plugin sub-path.
        location /plugins/kubeblocks-ui/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri $uri/ /plugins/kubeblocks-ui/index.html;
        }
    }
{{- end }}
