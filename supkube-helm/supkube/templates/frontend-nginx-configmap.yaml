# v0.8.5: nginx config moved out of the Dockerfile into a ConfigMap so we
# can add the /dex/* upstream without rebuilding the frontend image.
#
# PRD-028 / ADR-056 v2: this is now an nginx envsubst TEMPLATE, not the final
# config. It is mounted at /etc/nginx/templates/default.conf.template; the
# nginx:alpine entrypoint (20-envsubst-on-templates.sh) expands ${BASE_PATH}
# at container start and writes /etc/nginx/conf.d/default.conf.
#
# Helm renders EVERYTHING that is known at install time (the backend upstream,
# the dex proxy gated on .Values.auth.dex.enabled, the asset regex). ${BASE_PATH}
# is the ONLY shell-style literal left for startup envsubst — it is the
# normalized prefix: "" at root (so "location /" is unchanged → zero regression)
# or "/supkube" for a subpath. nginx's own $host/$uri/$scheme etc. survive
# envsubst because the entrypoint restricts substitution to declared env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "supkube.fullname" . }}-frontend-nginx
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf.template: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Long-cache hashed assets (Vite produces content-hashed filenames).
        location ~* ^${BASE_PATH}/assets/.*\.(js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            try_files $uri =404;
        }

        # The SPA shell. Never cached — same-hash redeploys still need to
        # fetch a fresh index.html so users pick up new bundle filenames.
        location = ${BASE_PATH}/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        # SPA fallback.
        location ${BASE_PATH}/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            try_files $uri $uri/ ${BASE_PATH}/index.html;
        }

        # Backend API proxy. Bearer tokens flow through here.
        location ${BASE_PATH}/api/ {
            proxy_pass http://{{ include "supkube.fullname" . }}-backend:{{ .Values.service.backend.port }}/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Cache-Control;
            proxy_hide_header Pragma;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        {{- if .Values.auth.dex.enabled }}

        # v0.8.5: Dex OIDC proxy. The browser hits /dex/auth, /dex/callback,
        # /dex/.well-known/openid-configuration, etc. — all go to the
        # embedded Dex pod. Issuer URL in JWTs matches this path so the
        # backend's OIDC verifier accepts them.
        # Dex serves routes at the issuer's path prefix. With
        # issuer=http://host/dex, Dex internally listens at /dex/auth,
        # /dex/token, etc. We must NOT strip the prefix — `proxy_pass`
        # without a trailing path preserves the full URI.
        # PRD-028: when SupKube is under a subpath, the browser-facing path is
        # ${BASE_PATH}/dex/ but the issuer (auth.dex.publicURL) ends in /dex,
        # so we strip ${BASE_PATH} before forwarding to keep Dex's internal
        # /dex/... routing intact.
        location ${BASE_PATH}/dex/ {
            proxy_pass http://{{ include "supkube.fullname" . }}-dex:5556/dex/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        {{- end }}
    }
