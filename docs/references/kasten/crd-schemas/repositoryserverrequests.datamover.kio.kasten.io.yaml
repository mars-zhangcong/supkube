    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RepositoryServerRequest is a per-job CR that drives the lifecycle of a shared
          repository server pod. Each export or retire workflow creates one at startup
          and deletes it on completion. The controller counts non-expired live RSR CRs
          to decide whether the idle-TTL clock should start.

          The RSR carries all information needed to bootstrap the server: repository
          connection details (shared across all RSRs for the same backend) and the
          per-job client identity (username + hostname) used to add the datamover to
          the server's htpasswd file. Fields that can be derived from the environment
          or cluster constants are sourced by the controller, not stored here.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RepositoryServerRequestSpec is set by the workflow at creation time.
              Fields in Repository must agree across all RSRs for the same backend
              (same LabelRepositoryServerBackendName label); the controller validates
              this and sets Status.Phase=Failed on conflicting RSRs.
            properties:
              appNamespace:
                description: |-
                  AppNamespace identifies the K8s namespace whose data is being processed.
                  Together with ProfileRef.Name it determines which backend the request
                  attaches to (via the deterministic LabelRepositoryServerBackendName label).
                type: string
              deadline:
                description: |-
                  Deadline is the absolute time after which the controller stops counting
                  this RSR when computing the active-client count. This bounds the impact
                  of executor hard-crashes: a dead client cannot keep the server alive
                  indefinitely once its deadline passes.
                format: date-time
                type: string
              jobID:
                description: |-
                  JobID is the workflow job identifier used for diagnostics and to derive
                  the deterministic RSR name (rsr-{jobID}). Not used for server logic.
                type: string
              profileRef:
                description: ProfileRef references the K10 Location Profile for this
                  backend.
                properties:
                  name:
                    description: Name of the referenced object
                    type: string
                  namespace:
                    description: |-
                      Namespace where the object is located. If it is empty, it should be
                      interpreted as the same namespace of the referencing object, and not
                      `default` by default.
                    type: string
                required:
                - name
                type: object
              repository:
                description: |-
                  Repository has the details required to connect to the repository.
                  All RSRs for the same backend must carry identical Repository values.
                properties:
                  hostname:
                    description: |-
                      If specified, these values will be used by the controller to
                      override default hostname when connecting to the
                      repository from the server.
                    type: string
                  rootPath:
                    description: |-
                      RootPath is a relative sub path within the path prefix specified in the
                      location profile.
                    type: string
                    x-kubernetes-validations:
                    - message: Value is immutable
                      rule: self == oldSelf
                  username:
                    description: |-
                      If specified, these values will be used by the controller to
                      override default username when connecting to the
                      repository from the server.
                    type: string
                required:
                - rootPath
                type: object
              userAccess:
                description: |-
                  UserAccess identifies the client user for this specific job's
                  datamover pod. The controller generates and manages the per-user
                  passphrase internally; callers only supply the identity.
                properties:
                  hostname:
                    description: Hostname is the client hostname for this datamover.
                    type: string
                  username:
                    description: Username is the client username for this datamover.
                    type: string
                required:
                - hostname
                - username
                type: object
            required:
            - appNamespace
            - profileRef
            - repository
            - userAccess
            type: object
          status:
            description: |-
              RepositoryServerRequestStatus is written by the controller. Workflows poll
              Status.Phase until Ready, then read Status.ServerInfo for connection details.
            properties:
              conditions:
