{{- if .Values.kbAddon.enabled }}
# ClusterIP Services for kbui-backend and kbui-frontend.
# Exposure into the SupKube UI is via the SupKube frontend/ingress — these
# Services stay ClusterIP so the kbui pods are not directly reachable from
# outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supkube.fullname" . }}-kbui-backend
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: kbui-backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.kbAddon.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supkube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kbui-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "supkube.fullname" . }}-kbui-frontend
  labels:
    {{- include "supkube.labels" . | nindent 4 }}
    app.kubernetes.io/component: kbui-frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.kbAddon.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supkube.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kbui-frontend
{{- end }}
